<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语语法</title>
<style>
:root{
  --bg:#11131a;--card:#191c26;--card-2:#1f2330;--line:#2a2f3d;
  --ink:#e9ecf4;--ink-soft:#aeb4c5;--ink-mute:#6f7689;
  --accent:#7c9cff;--green:#5ec59a;--amber:#e2b23c;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --maxw:580px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:30px 16px 90px}
.wrap{max-width:var(--maxw);margin:0 auto}
[hidden]{display:none!important}

/* ---- 顶部 ---- */
.brand{font-size:26px;font-weight:700}
.sub{font-size:13px;color:var(--ink-mute);margin:6px 0 18px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.tab{appearance:none;border:0;background:transparent;color:var(--ink-soft);font:600 14.5px var(--sans);padding:9px 0;border-radius:9px;cursor:pointer}
.tab .n{font-weight:500;font-size:12px;color:var(--ink-mute);margin-left:5px}
.tab.on{background:var(--card-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tab.on .n{color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- 章节目录 ---- */
.toc{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line)}
.toc a{text-decoration:none;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:var(--ink-soft);font-size:13px;padding:8px 4px;transition:.15s}
.toc a .n{font-size:11.5px;color:var(--ink-mute);margin-left:4px}
.toc a:hover{border-color:var(--accent);color:var(--ink)}
.toc a.active{border-color:var(--accent);color:var(--accent);background:var(--card-2)}
.toc a.active .n{color:var(--accent)}

/* ---- 章节 ---- */
.mod{margin-top:28px;scroll-margin-top:72px}
.mod-head{display:flex;align-items:baseline;gap:10px}
.mod-name{font-size:19px;font-weight:700}
.mod-count{font-size:12px;color:var(--ink-mute)}
.mod-intro{font-size:12.5px;color:var(--ink-mute);line-height:1.7;margin:5px 0 12px}
.sub-label{font-size:11.5px;letter-spacing:.08em;color:var(--ink-mute);margin:16px 0 8px}
.items{display:flex;flex-direction:column;gap:9px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;text-decoration:none;color:var(--ink);transition:.15s}
.item:hover{border-color:var(--accent);background:var(--card-2)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item.todo{border-style:dashed;background:transparent;opacity:.5;pointer-events:none}
.num{flex:0 0 34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:rgba(124,156,255,.12);color:var(--accent);font:700 13px var(--mono)}
.num.none{background:rgba(111,118,137,.14);color:var(--ink-mute)}
.it-main{flex:1;min-width:0}
.it-title{font-size:15px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.it-desc{font-size:12.5px;color:var(--ink-mute);line-height:1.6;margin-top:3px}
.it-arrow{flex-shrink:0;font-size:18px;color:var(--ink-mute)}
.badge{font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:700;background:rgba(226,178,60,.15);color:var(--amber)}

/* ---- 测验 ---- */
.quiz-intro{margin:18px 0 14px;padding:10px 12px;font-size:13px;line-height:1.7;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px}
.quiz{display:block;margin-bottom:10px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  text-decoration:none;color:var(--ink);transition:.15s}
.quiz:hover{border-color:var(--accent);background:var(--card-2)}
.q-top{display:flex;align-items:center;gap:8px}
.q-title{font-size:16px;font-weight:700}
.new{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(94,197,154,.15);color:var(--green)}
.q-desc{font-size:12.5px;color:var(--ink-mute);line-height:1.65;margin:5px 0 10px}
.q-meta{display:flex;gap:8px;font-size:12px;color:var(--ink-soft)}
.q-meta span{background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 18px;text-align:center;color:var(--ink-mute);font-size:13px}

/* ---- 对照检查 ---- */
.check-go{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:15px 16px;border-radius:14px;text-decoration:none;color:var(--ink);
  background:linear-gradient(135deg,rgba(124,156,255,.16),rgba(124,156,255,.05));border:1px solid rgba(124,156,255,.35);transition:.15s}
.check-go:hover{border-color:var(--accent)}
.check-go .cg-main{flex:1;min-width:0}
.check-go .cg-t{font-size:16px;font-weight:700}
.check-go .cg-d{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:3px}
.c-label{font-size:11.5px;letter-spacing:.08em;color:var(--ink-mute);margin:4px 0 8px}
#checklist .q-meta{flex-wrap:wrap}#checklist .q-meta span{white-space:nowrap}
.q-meta span.miss{color:#ff8a80}.q-meta span.half{color:var(--amber)}.q-meta span.off{color:#c29bff}.q-meta span.ok{color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">📖 英语语法</div>
  <div class="sub" id="sub"></div>
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="notes" role="tab">语法笔记<span class="n" id="n-notes"></span></button>
    <button class="tab" data-tab="quiz" role="tab">测验<span class="n" id="n-quiz"></span></button>
    <button class="tab" data-tab="check" role="tab">对照检查<span class="n" id="n-check"></span></button>
  </div>
</header>

<main id="view-notes">
  <nav class="toc" id="toc"></nav>
  <div id="body"></div>
</main>

<main id="view-quiz" hidden>
  <div class="quiz-intro">最新的一套在最上面。每套题做完，结果会自动发给我；回微信说一声「做完了」，就能收到批改。</div>
  <div id="quizlist"></div>
</main>

<main id="view-check" hidden>
  <div class="quiz-intro">课程笔记用：把自己的理解和课程原文贴进去提交，回聊天说一声「检查」，我按原文逐条对照，标出漏掉的和理解偏的，再做补充。</div>
  <a class="check-go" href="check/"><div class="cg-main"><div class="cg-t">打开对照检查</div>
    <div class="cg-d">贴上「我的理解」和「原文文稿」，提交给我</div></div><div class="it-arrow">›</div></a>
  <div class="c-label">检查记录</div>
  <div id="checklist"><div class="empty">还没有检查记录</div></div>
</main>
</div>

  { label:'香草失窃案', n:26, href:'quiz/vanilla-case.html', date:'2026-10-05',
    desc:'侦探剧情版：用 10/1–10/5 的生词练时态、骨架、相似词、词组，第五幕揭晓小偷是谁。' },
  { label:'长难句 01 · 排队放音乐', n:9, href:'quiz/long-sentence-1.html', date:'2026-09-30',
    desc:'28 个词的长句：定语从句插在主语和谓语中间、keep sb + adj.、分词作定语、两个不一样的 that。' },
  { label:'疑问句测试', n:13, href:'quiz/questions-1.html', date:'2026-09-30',
    desc:'一般疑问、特殊疑问、疑问词，外加三个坑：问主语不用助动词、回答用回助动词、否定疑问的 Yes / No 看事实。' }
];
/* ====================================================== */

const $toc = document.getElementById('toc'), $body = document.getElementById('body');
let notes = 0;

MODULES.forEach(mod => {
  const n = mod.sections.reduce((a, s) => a + s.items.filter(i => !i.todo).length, 0);
  notes += n;

  const chip = document.createElement('a');
  chip.href = '#' + mod.id;
  chip.dataset.id = mod.id;
  chip.innerHTML = `${mod.name}<span class="n">${n}</span>`;
  $toc.appendChild(chip);

  const sec = document.createElement('section');
  sec.className = 'mod';
  sec.id = mod.id;
  sec.innerHTML =
    `<div class="mod-head"><div class="mod-name">${mod.name}</div><div class="mod-count">${n} 篇</div></div>
     <div class="mod-intro">${mod.intro}</div>`;
  if (!n) sec.insertAdjacentHTML('beforeend', '<div class="empty">这一篇还没有笔记</div>');

  mod.sections.forEach(s => {
    if (!s.items.length) return;
    if (s.label) sec.insertAdjacentHTML('beforeend', `<div class="sub-label">${s.label}</div>`);
    const box = document.createElement('div');
    box.className = 'items';
    s.items.forEach(it => {
      const m = it.label.match(/^(\d+)\s*·\s*(.+)$/);
      const el = document.createElement(it.todo ? 'div' : 'a');
      el.className = 'item' + (it.todo ? ' todo' : '');
      if (!it.todo) el.href = it.href;
      el.innerHTML =
        `<div class="num${m ? '' : ' none'}">${m ? m[1] : '•'}</div>
         <div class="it-main">
           <div class="it-title">${m ? m[2] : it.label}${it.todo ? '<span class="badge">待写</span>' : ''}</div>
           ${it.desc ? `<div class="it-desc">${it.desc}</div>` : ''}
         </div>
         <div class="it-arrow">${it.todo ? '' : '›'}</div>`;
      box.appendChild(el);
    });
    sec.appendChild(box);
  });
  $body.appendChild(sec);
});

const $quiz = document.getElementById('quizlist');
if (!QUIZZES.length) $quiz.innerHTML = '<div class="empty">还没有测验</div>';
QUIZZES.forEach((q, i) => {
  const [, mm, dd] = (q.date || '').split('-');
  const a = document.createElement('a');
  a.className = 'quiz';
  a.href = q.href;
  a.innerHTML =
    `<div class="q-top"><span class="q-title">${q.label}</span>${i === 0 ? '<span class="new">最新</span>' : ''}</div>
     ${q.desc ? `<div class="q-desc">${q.desc}</div>` : ''}
     <div class="q-meta"><span>${q.n} 题</span>${mm ? `<span>${+mm} 月 ${+dd} 日</span>` : ''}</div>`;
  $quiz.appendChild(a);
});

document.getElementById('sub').textContent = `${notes} 篇笔记 · ${QUIZZES.length} 套测验`;
document.getElementById('n-notes').textContent = notes;
document.getElementById('n-quiz').textContent = QUIZZES.length;

/* 对照检查：记录由 scripts/check_page.py 写在 check/checks.json，这里读出来 */
const CHECK_NAMES = { miss:'漏了', half:'抓到一半', off:'理解有偏差', ok:'抓到了' };
const escHtml = s => String(s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
document.getElementById('n-check').textContent = 0;
fetch('check/checks.json?' + Date.now()).then(r => r.ok ? r.json() : []).then(list => {
  document.getElementById('n-check').textContent = list.length;
  if (!list.length) return;
  const box = document.getElementById('checklist');
  box.innerHTML = '';
  list.forEach(c => {
    const [, mm, dd] = (c.date || '').split('-');
    const a = document.createElement('a');
    a.className = 'quiz';
    a.href = 'check/' + encodeURIComponent(c.id) + '.html';
    const chips = Object.keys(CHECK_NAMES).filter(k => c.counts && c.counts[k])
      .map(k => `<span class="${k}">${CHECK_NAMES[k]} ${c.counts[k]}</span>`).join('');
    a.innerHTML =
      `<div class="q-top"><span class="q-title">${escHtml(c.title)}</span></div>
       ${c.kicker ? `<div class="q-desc">${escHtml(c.kicker)}</div>` : ''}
       <div class="q-meta">${chips}${mm ? `<span>${+mm} 月 ${+dd} 日</span>` : ''}</div>`;
    box.appendChild(a);
  });
}).catch(() => {});

/* 三个标签页：地址带 #quiz / #check 时直接打开对应的页 */
const tabs = [...document.querySelectorAll('.tab')];
const VIEWS = ['notes', 'quiz', 'check'];
function show(name) {
  VIEWS.forEach(v => { document.getElementById('view-' + v).hidden = name !== v; });
  tabs.forEach(t => { t.classList.toggle('on', t.dataset.tab === name); t.setAttribute('aria-selected', t.dataset.tab === name); });
}
tabs.forEach(t => t.addEventListener('click', () => {
  show(t.dataset.tab);
  history.replaceState(null, '', t.dataset.tab === 'notes' ? location.pathname : '#' + t.dataset.tab);
}));
show(VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'notes');

/* 滚动时高亮当前章节 */
const chips = [...$toc.querySelectorAll('a')];
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) chips.forEach(c => c.classList.toggle('active', c.dataset.id === e.target.id));
  });
}, { rootMargin: '-80px 0px -70% 0px' });
document.querySelectorAll('.mod').forEach(m => io.observe(m));
</script>
</body>
</html>

<title>英语语法</title>

<style>
:root{
  --bg:#11131a;
  --card:#191c26;
  --card-2:#1f2330;
  --line:#2a2f3d;

  --ink:#e9ecf4;
  --ink-soft:#aeb4c5;
  --ink-mute:#6f7689;

  --accent:#7c9cff;

  --sans:-apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
}

body{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:36px 16px 80px;
}

.title{
  font-size:26px;
  font-weight:700;
  margin-bottom:6px;
}

.sub{
  font-size:13.5px;
  color:var(--ink-mute);
  margin-bottom:28px;
}

.panel{
  width:100%;
  max-width:440px;
  display:flex;
  flex-direction:column;
  gap:11px;
}

/* 分组标题 */
.group-label{
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink-mute);

  margin:14px 0 2px;

  display:flex;
  align-items:center;
  gap:9px;
}

.group-label:first-child{
  margin-top:0;
}

.group-label::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--line);
}

/* 条目 */
.item{
  display:flex;
  align-items:center;
  justify-content:space-between;

  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;

  padding:15px 18px;

  text-decoration:none;
  color:var(--ink);

  transition:.15s;
}

.item:hover{
  border-color:var(--accent);
  background:var(--card-2);
}

.it-left{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0;
}

.it-label{
  font-size:15.5px;
  font-weight:600;
}

.it-date{
  font-size:12px;
  color:var(--ink-mute);
}

.it-arrow{
  font-size:18px;
  color:var(--ink-mute);
  flex-shrink:0;
  margin-left:10px;
}
</style>
</head>

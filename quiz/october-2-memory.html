<div class="top"><div><h1>10·02 单词快速记忆</h1><p class="lead">不是反复看，而是先回忆、再揭晓；忘掉的词会在几张卡之后重新出现。</p></div></div>
<section class="panel controls">
  <div class="row"><span class="lab">模式</span><div class="seg" id="modes"><button data-mode="zh-en" class="on">中 → 英</button><button data-mode="en-zh">英 → 中</button><button data-mode="browse">双语浏览</button></div></div>
  <div class="row"><span class="lab">显示</span><button class="toggle on" id="showEn">英文解释</button><button class="toggle on" id="showZh">中文释义</button><button class="toggle on" id="showEx">例句</button></div>
  <div class="row"><span class="lab">发音</span><div class="seg" id="accents"><button data-acc="gb" class="on">英音</button><button data-acc="us">美音</button></div><button class="toggle" id="loop">循环</button><button class="ghost" id="shuffle">洗牌本轮</button><button class="ghost" id="reset">重置进度</button></div>
  <div class="tip">每轮 10 词；点“记住了”会升级，达到 3 级算掌握；点“忘记了”会降级，并在几张卡后再次出现。</div>
  </section>
<section class="stats">
 <div class="panel stat"><b id="mastered">0</b><span>已掌握</span></div>
 <div class="panel stat"><b id="learning">68</b><span>学习中</span></div>
 <div class="panel stat"><b id="round">0 / 10</b><span>本轮</span></div>

</section>
<div class="meter"><i id="meter"></i></div>
<section class="panel card" id="card">

   <div class="hint" id="promptHint"></div>
   <div class="clue" id="clue"></div>
   <div class="word hidden" id="promptWord"></div><div class="ipa hidden" id="promptIpa"></div>

 </div>

   <div class="feedback" id="feedback"></div>

   <div class="def" id="zhDef"><small>中文</small><span></span></div>
   <div class="example" id="example"><div class="en"></div><div class="zh"></div></div>
 </div>
 <div class="rating" id="rating"><button class="again" data-rate="again">1 忘了<br><small>很快再来</small></button><button class="fuzzy" data-rate="fuzzy">2 模糊<br><small>稍后再来</small></button><button class="know" data-rate="know">3 记住了<br><small>提高等级</small></button></div>
 <div class="finish" id="finish"><div>本轮完成</div><h2 id="finishTitle"></h2><p id="finishText"></p><div class="actions"><button class="primary" id="nextRound">开始下一轮</button><button class="ghost" id="reviewWeak">只练薄弱词</button></div></div>
</section>

<script>
const DATA=[{"word":"energize","ipa":"/ˈenədʒaɪz/","zh":"v. 使充满活力；激励；给……供能","en":"to give someone or something more energy or power","exEn":"Coffee energizes me in the morning.","exZh":"咖啡让我早上精神起来。"},{"word":"beyond","ipa":"/bɪˈjɒnd/","zh":"prep. 在……之外；超出；超过","en":"farther than, later than, or outside a limit","exEn":"The village is just beyond those hills.","exZh":"村子就在那些山丘的那边。"},{"word":"expect","ipa":"/ɪkˈspekt/","zh":"v. 期望；预料；等待","en":"to think something will happen, or require someone to do something","exEn":"I expect it will rain this afternoon.","exZh":"我预计今天下午会下雨。"},{"word":"physically","ipa":"/ˈfɪzɪkli/","zh":"adv. 身体上；肉体上；物理上","en":"in a way related to the body or to material things","exEn":"She is physically fit and full of energy.","exZh":"她身体健康，精力充沛。"},{"word":"available","ipa":"/əˈveɪləbl/","zh":"adj. 可用的；可获得的；有空的","en":"ready to be used, obtained, or contacted","exEn":"Tickets are available online.","exZh":"票可以在网上买到。"},{"word":"gradual","ipa":"/ˈɡrædʒuəl/","zh":"adj. 逐渐的；渐进的","en":"happening slowly in small steps","exEn":"There has been a gradual improvement in her health.","exZh":"她的健康状况在逐渐好转。"},{"word":"best-fitting","ipa":"/ˌbest ˈfɪtɪŋ/","zh":"adj. 最合身的；最合适的","en":"fitting the body or situation better than the other choices","exEn":"These are my best-fitting jeans.","exZh":"这是我最合身的牛仔裤。","audioParts":["best","fitting"]},{"word":"stretch","ipa":"/stretʃ/","zh":"v. 伸展；拉长；延伸 n. 伸展；一段","en":"to make your body or something longer or wider","exEn":"She stretched her arms above her head.","exZh":"她把双臂举过头顶伸展。"},{"word":"steady","ipa":"/ˈstedi/","zh":"adj. 稳定的；平稳的；稳步的","en":"stable and not changing suddenly","exEn":"He has made steady progress in English.","exZh":"他的英语在稳步进步。"},{"word":"contribute","ipa":"/kənˈtrɪbjuːt/","zh":"vt. 捐献（钱、物）；贡献（时间、主意） vi. 做贡献；促成，是……的原因之一（contribute to）","en":"to give or add something that helps produce a result","exEn":"We all contributed money to buy her a gift.","exZh":"我们都出了钱给她买礼物。"},{"word":"condition","ipa":"/kənˈdɪʃn/","zh":"n. 状况，状态；条件；（复数）环境","en":"the state something is in, or a requirement for something","exEn":"This old bike is still in good condition.","exZh":"这辆旧自行车状况还很好。"},{"word":"straight","ipa":"/streɪt/","zh":"adj. 直的，笔直的；直接的；连续的 adv. 直接地，径直地","en":"without a bend, turn, or delay","exEn":"Draw a straight line with a ruler.","exZh":"用尺子画一条直线。"},{"word":"forth","ipa":"/fɔːθ/","zh":"adv. 向前；向外（较书面；多见于固定说法）","en":"forward or outward, mainly in fixed phrases","exEn":"The children ran back and forth in the yard.","exZh":"孩子们在院子里跑来跑去。"},{"word":"seek","ipa":"/siːk/","zh":"vt. 寻找；寻求；争取","en":"to try to find or get something","exEn":"She sought help from her teacher.","exZh":"她向老师寻求帮助。"},{"word":"consistent","ipa":"/kənˈsɪstənt/","zh":"adj. 前后一致的；一贯的；稳定的","en":"staying the same, or agreeing with something else","exEn":"Her words are consistent with her actions.","exZh":"她说的和做的一致。"},{"word":"state","ipa":"/steɪt/","zh":"vt. 陈述；说明 n. 状态；状况","en":"to say something clearly and formally; also, a condition","exEn":"Please state your name.","exZh":"请说出你的名字。"},{"word":"represent","ipa":"/ˌreprɪˈzent/","zh":"vt. 代表；表示；象征","en":"to stand for, show, or act for someone or something","exEn":"She represents our team.","exZh":"她代表我们的团队。"},{"word":"sufficient","ipa":"/səˈfɪʃənt/","zh":"adj. 足够的；充分的","en":"enough for a particular purpose","exEn":"We have sufficient food for everyone.","exZh":"我们有足够的食物给每个人。"},{"word":"statistic","ipa":"/stəˈtɪstɪk/","zh":"n. 统计数字；统计量","en":"a number that shows a fact about a group or situation","exEn":"This statistic surprised me.","exZh":"这个统计数字让我吃惊。"},{"word":"integrate","ipa":"/ˈɪntɪɡreɪt/","zh":"vt. 整合；使融入 vi. 融入","en":"to combine parts, or become part of a group or system","exEn":"We integrated the new tool into the app.","exZh":"我们把新工具整合进了应用。"},{"word":"authority","ipa":"/ɔːˈθɒrəti/","zh":"n. 权力；权威；（复数）当局","en":"the power to decide, or a person or body with that power","exEn":"The manager has the authority to make this choice.","exZh":"经理有权作这个决定。"},{"word":"identify","ipa":"/aɪˈdentɪfaɪ/","zh":"vt. 认出；识别；确定","en":"to recognize or determine exactly what something is","exEn":"Can you identify this person?","exZh":"你能认出这个人吗？"},{"word":"credible","ipa":"/ˈkredəbəl/","zh":"adj. 可信的；可靠的","en":"believable and trustworthy","exEn":"Her story sounds credible.","exZh":"她的说法听起来可信。"},{"word":"appropriate","ipa":"/əˈprəʊpriət/","zh":"adj. 合适的；恰当的","en":"suitable for a particular situation or purpose","exEn":"This book is appropriate for children.","exZh":"这本书适合儿童。"},{"word":"bias","ipa":"/ˈbaɪəs/","zh":"n. 偏见；偏向；偏差 vt. 使有偏见","en":"an unfair preference that affects judgement","exEn":"The report shows a clear bias.","exZh":"这份报告表现出明显的偏向。"},{"word":"reflect","ipa":"/rɪˈflekt/","zh":"vt. 反射；反映 vi. 深思；反思","en":"to show an image or fact, or think carefully about something","exEn":"The mirror reflects light.","exZh":"镜子反射光。"},{"word":"inform","ipa":"/ɪnˈfɔːm/","zh":"vt. 告知；通知","en":"to give someone information","exEn":"Please inform me of any change.","exZh":"如有变化，请通知我。"},{"word":"contact","ipa":"/ˈkɒntækt/","zh":"vt. 联系 n. 联系；联系人；接触","en":"to communicate with someone","exEn":"Please contact me tomorrow.","exZh":"请明天联系我。"},{"word":"calculate","ipa":"/ˈkælkjəleɪt/","zh":"vt. 计算；算出","en":"to find an amount by using numbers","exEn":"Can you calculate the total cost?","exZh":"你能算出总费用吗？"},{"word":"approximate","ipa":"/əˈprɒksɪmət/","zh":"adj. 大约的；近似的","en":"close to the true number but not exact","exEn":"The approximate cost is 50 dollars.","exZh":"大概费用是50美元。"},{"word":"ankle","ipa":"/ˈæŋkəl/","zh":"n. 脚踝；踝关节","en":"the joint between the foot and the leg","exEn":"My ankle hurts.","exZh":"我的脚踝疼。"},{"word":"caution","ipa":"/ˈkɔːʃn/","zh":"n. 小心；谨慎；警告 vt. 告诫","en":"care taken to avoid danger or mistakes","exEn":"We need to act with caution.","exZh":"我们需要谨慎行事。"},{"word":"spirit","ipa":"/ˈspɪrɪt/","zh":"n. 精神；斗志；心情（复数 spirits）；灵魂","en":"energy, courage, mood, or the non-physical part of a person","exEn":"They showed great team spirit.","exZh":"他们表现出了很强的团队精神。"},{"word":"release","ipa":"/rɪˈliːs/","zh":"vt. 释放；发布 n. 释放；发布；新版本","en":"to let go, or make something available to the public","exEn":"They will release the new app tomorrow.","exZh":"他们明天会发布新应用。"},{"word":"perform","ipa":"/pəˈfɔːm/","zh":"vt. 执行；表演 vi. 演出；表现","en":"to do a task, act, or entertain an audience","exEn":"We need to perform a test.","exZh":"我们需要做一次测试。"},{"word":"empower","ipa":"/ɪmˈpaʊə/","zh":"vt. 授权；使有能力、能自主决定","en":"to give someone the ability or authority to act","exEn":"Good teachers empower students to ask questions.","exZh":"好老师让学生有信心提问。"},{"word":"effect","ipa":"/ɪˈfekt/","zh":"n. 效果；影响","en":"a change caused by something","exEn":"The change had a clear effect.","exZh":"这次改变产生了明显效果。"},{"word":"participate","ipa":"/pɑːˈtɪsɪpeɪt/","zh":"vi. 参加；参与","en":"to take part in an activity","exEn":"She will participate in the game.","exZh":"她会参加这个游戏。"},{"word":"instrument","ipa":"/ˈɪnstrəmənt/","zh":"n. 工具；仪器；乐器","en":"a tool, measuring device, or musical device","exEn":"A guitar is a musical instrument.","exZh":"吉他是一种乐器。"},{"word":"evidence","ipa":"/ˈevɪdəns/","zh":"n. 证据；依据","en":"facts or signs that show something is true","exEn":"The police found evidence.","exZh":"警方找到了证据。"},{"word":"lengthen","ipa":"/ˈleŋθən/","zh":"vt. 使变长；延长 vi. 变长","en":"to become longer or make something longer","exEn":"She lengthened the skirt.","exZh":"她把裙子放长了。"},{"word":"cycle","ipa":"/ˈsaɪkəl/","zh":"n. 循环；周期 vi. 骑自行车","en":"a repeated series, or to ride a bicycle","exEn":"I cycle to school every day.","exZh":"我每天骑车上学。"},{"word":"strengthen","ipa":"/ˈstreŋθən/","zh":"vt. 加强；增强 vi. 变强","en":"to make or become stronger","exEn":"We need to strengthen the team.","exZh":"我们需要增强团队实力。"},{"word":"vanilla","ipa":"/vəˈnɪlə/","zh":"n. 香草；香草味 adj. 普通的；原版的（尤指软件）","en":"a flavour; also, a plain standard version without extras","exEn":"I like vanilla ice cream.","exZh":"我喜欢香草冰淇淋。"},{"word":"chilli","ipa":"/ˈtʃɪli/","zh":"n. 辣椒；辣椒粉","en":"a hot pepper, or powder made from it","exEn":"She added a red chilli to the soup.","exZh":"她往汤里加了一只红辣椒。"},{"word":"currency","ipa":"/ˈkʌrənsi/","zh":"n. 货币；通货","en":"the money used in a country","exEn":"We need some local currency for the trip.","exZh":"这次旅行我们需要一些当地货币。"},{"word":"tropical","ipa":"/ˈtrɒpɪkəl/","zh":"adj. 热带的","en":"from or related to hot areas near the equator","exEn":"Mangoes are tropical fruits.","exZh":"芒果是热带水果。"},{"word":"pod","ipa":"/pɒd/","zh":"n. （豌豆等的）豆荚；（可可、香草等的）果荚","en":"a case produced by a plant that contains seeds","exEn":"Cocoa beans grow inside cocoa pods.","exZh":"可可豆长在可可果荚里。"},{"word":"yield","ipa":"/jiːld/","zh":"vt. 产出；产生 vi. 屈服；让路 n. 产量；收益","en":"to produce, give way, or the amount produced","exEn":"The test yielded useful results.","exZh":"测试得到了有用的结果。"},{"word":"annual","ipa":"/ˈænjuəl/","zh":"adj. 每年的；一年一次的","en":"happening once every year","exEn":"The company published its annual report.","exZh":"公司发布了年度报告。"},{"word":"ripe","ipa":"/raɪp/","zh":"adj. （水果、庄稼）成熟的；（时机）合适的","en":"ready to eat or harvest; also, ready at the right time","exEn":"These bananas are ripe now.","exZh":"这些香蕉现在熟了。"},{"word":"gram","ipa":"/ɡræm/","zh":"n. 克","en":"a unit of weight equal to one thousandth of a kilogram","exEn":"Add ten grams of sugar.","exZh":"加十克糖。"},{"word":"depress","ipa":"/dɪˈpres/","zh":"vt. 使沮丧；压低（价格、经济活动等）","en":"to make someone sad, or reduce a level of activity","exEn":"The bad news depressed him.","exZh":"坏消息让他很沮丧。"},{"word":"comedy","ipa":"/ˈkɒmədi/","zh":"n. 喜剧（电影、戏剧等）；喜剧作品","en":"entertainment intended to make people laugh","exEn":"We watched a romantic comedy.","exZh":"我们看了一部浪漫喜剧。"},{"word":"physician","ipa":"/fɪˈzɪʃən/","zh":"n. 医生（较正式，尤指非外科医生）","en":"a formal word for a medical doctor","exEn":"A physician examined the child.","exZh":"一位医生给孩子做了检查。"},{"word":"simulate","ipa":"/ˈsɪmjəleɪt/","zh":"vt. 模拟；假装","en":"to copy a real situation for practice or testing","exEn":"We simulated an attack to test the system.","exZh":"我们模拟一次攻击来测试系统。"},{"word":"cognitive","ipa":"/ˈkɒɡnətɪv/","zh":"adj. 认知的；与思考、记忆、判断有关的","en":"related to thinking, memory, and understanding","exEn":"Memory is a cognitive ability.","exZh":"记忆是一种认知能力。"},{"word":"positive","ipa":"/ˈpɒzətɪv/","zh":"adj. 积极的；肯定的；（检测）阳性的；（数字）正的","en":"good or hopeful; also, above zero or showing something is present","exEn":"Try to stay positive.","exZh":"尽量保持积极的心态。"},{"word":"helicopter","ipa":"/ˈhelɪkɒptə(r)/","zh":"n. 直升机","en":"an aircraft with large rotating blades","exEn":"A helicopter flew over the mountain and landed near a small village.","exZh":"一架直升机飞过那座山，降落在一个小村庄附近。"},{"word":"disguise","ipa":"/dɪsˈɡaɪz/","zh":"vt. 伪装；掩饰 n. 伪装；伪装物","en":"something that hides identity, or to hide someone's appearance","exEn":"He disguised himself as a waiter at the hotel.","exZh":"他在酒店把自己装扮成一名服务员。"},{"word":"scold","ipa":"/skəʊld/","zh":"vt. 责骂，训斥","en":"to speak angrily because someone has done something wrong","exEn":"His mother scolded him for coming home late.","exZh":"他妈妈因为他回家晚而责骂了他。"},{"word":"dispose","ipa":"/dɪˈspəʊz/","zh":"vi. 处理，处置（与 of 连用）","en":"to get rid of something, normally used with “of”","exEn":"Please dispose of the bottles in this bin.","exZh":"请把这些瓶子处理到这个垃圾桶里。"},{"word":"ordinary","ipa":"/ˈɔːdnri/","zh":"adj. 普通的，平常的；平凡的","en":"normal and not special","exEn":"It looked like an ordinary house from the road.","exZh":"从路上看，它就像一座普通的房子。"},{"word":"federal","ipa":"/ˈfedərəl/","zh":"adj. 联邦的；联邦政府的","en":"related to the central government of a federation","exEn":"The federal government provided money for the project.","exZh":"联邦政府为这个项目提供了资金。"},{"word":"situate","ipa":"/ˈsɪtʃueɪt/","zh":"vt. 使位于；安置","en":"to place or locate something in a particular position","exEn":"The hotel is situated near the station.","exZh":"这家酒店位于车站附近。"},{"word":"strategy","ipa":"/ˈstrætədʒi/","zh":"n. 策略；战略；行动计划","en":"a plan for reaching a goal","exEn":"We need a clear strategy for dealing with this problem.","exZh":"我们需要一个处理这个问题的明确策略。"},{"word":"preserve","ipa":"/prɪˈzɜːv/","zh":"vt. 保护；保存；保鲜；保留","en":"to protect something from damage, decay, or unwanted change","exEn":"Salt helps preserve food for longer.","exZh":"盐有助于把食物保存得更久。"},{"word":"wise","ipa":"/waɪz/","zh":"adj. 明智的；有智慧的","en":"able to make good decisions from knowledge and experience","exEn":"She made a wise decision after talking with her family.","exZh":"她和家人谈过之后作出了明智的决定。"}];
const KEY='october-2-memory-v1', SETKEY='october-2-memory-settings-v1';
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let settings={mode:'zh-en',showEn:true,showZh:true,showEx:true,accent:'gb',loop:false};try{Object.assign(settings,JSON.parse(localStorage.getItem(SETKEY)||'{}'))}catch(e){}
const levels=Object.fromEntries(DATA.map(x=>[x.word,Math.max(0,Math.min(3,Number(saved[x.word]||0)))]));
let queue=[],cursor=0,revealed=false,firstAttempts=0,firstCorrect=0,roundBase=10,weakOnly=false,audio=null;
function save(){localStorage.setItem(KEY,JSON.stringify(levels));localStorage.setItem(SETKEY,JSON.stringify(settings))}
function makeQueue(weak=false){
 weakOnly=weak; const pool=DATA.map((_,i)=>i).filter(i=>weak?levels[DATA[i].word]<2:levels[DATA[i].word]<3);
 const source=pool.length?pool:DATA.map((_,i)=>i); const grouped=[0,1,2,3].flatMap(l=>shuffle(source.filter(i=>levels[DATA[i].word]===l)));
 queue=grouped.slice(0,Math.min(roundBase,grouped.length)); if(!queue.length)queue=shuffle(DATA.map((_,i)=>i)).slice(0,roundBase);
 cursor=0;firstAttempts=0;firstCorrect=0;render();
}
function item(){return DATA[queue[cursor]]}
function normalize(s){return String(s||'').trim().toLowerCase().replace(/[‐‑‒–—]/g,'-').replace(/\s+/g,' ')}
function answerKey(s){return normalize(s).replace(/[- ]/g,'')}
function updateStats(){
 const mastered=DATA.filter(x=>levels[x.word]>=3).length;$('mastered').textContent=mastered;$('learning').textContent=DATA.length-mastered;
 $('round').textContent=Math.min(cursor+1,queue.length)+' / '+queue.length;$('accuracy').textContent=firstAttempts?Math.round(firstCorrect/firstAttempts*100)+'%':'—';
 $('meter').style.width=(mastered/DATA.length*100)+'%';
 $('chips').innerHTML=DATA.map((x,i)=>`<button class="chip lv${levels[x.word]}" data-i="${i}">${x.word} · ${levels[x.word]}</button>`).join('');
}
function setLevelDots(n){$('level').innerHTML=[0,1,2].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}
function applyToggles(){
 $('enDef').classList.toggle('hidden',!settings.showEn);$('zhDef').classList.toggle('hidden',!settings.showZh);$('example').classList.toggle('hidden',!settings.showEx);
 $('example').querySelector('.zh').classList.toggle('hidden',!settings.showZh);
 ['showEn','showZh','showEx','loop'].forEach(id=>$(id).classList.toggle('on',settings[id]??settings.loop));
 document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===settings.mode));
 document.querySelectorAll('#accents button').forEach(b=>b.classList.toggle('on',b.dataset.acc===settings.accent));
}
function render(){
 updateStats();applyToggles();revealed=false;$('finish').classList.remove('show');$('study').classList.remove('hidden');$('details').classList.remove('show');$('rating').classList.remove('show');$('feedback').textContent='';$('feedback').className='feedback';
 if(cursor>=queue.length){finish();return} const x=item();$('position').textContent=`第 ${cursor+1} 张 · 本轮队列 ${queue.length} 张`;setLevelDots(levels[x.word]);
 $('clue').textContent='';$('promptWord').classList.add('hidden');$('promptIpa').classList.add('hidden');$('answerbox').classList.remove('hidden','reveal-only');$('answer').classList.remove('hidden');$('answer').value='';
 if(settings.mode==='zh-en'){$('promptHint').textContent='看中文，先从记忆里说出或输入英文';$('clue').textContent=x.zh;setTimeout(()=>$('answer').focus(),40)}
 else if(settings.mode==='en-zh'){$('promptHint').textContent='看英文，先在脑中说出中文意思';$('promptWord').textContent=x.word;$('promptIpa').textContent=x.ipa;$('promptWord').classList.remove('hidden');$('promptIpa').classList.remove('hidden');$('answer').classList.add('hidden');$('answerbox').classList.add('reveal-only')}
 else{$('promptHint').textContent='浏览模式：建立第一遍印象，然后切回“中 → 英”自测';$('promptWord').textContent=x.word;$('promptIpa').textContent=x.ipa;$('promptWord').classList.remove('hidden');$('promptIpa').classList.remove('hidden');$('clue').textContent=x.zh;$('answerbox').classList.add('hidden');reveal(false)}
}
function reveal(countAttempt=true){
 if(revealed)return;revealed=true;const x=item();let correct=null;
 if(settings.mode==='zh-en'&&countAttempt){firstAttempts++;correct=answerKey($('answer').value)===answerKey(x.word);if(correct)firstCorrect++}
 $('word').textContent=x.word;$('ipa').textContent=x.ipa;$('enDef').querySelector('span').textContent=x.en;$('zhDef').querySelector('span').textContent=x.zh;$('example').querySelector('.en').textContent=x.exEn;$('example').querySelector('.zh').textContent=x.exZh;
 if(correct===true){$('feedback').textContent='✓ 首次答对';$('feedback').classList.add('good')}else if(correct===false&&$('answer').value.trim()){$('feedback').textContent=`答案：${x.word}`;$('feedback').classList.add('bad')}else{$('feedback').textContent='先判断自己是否真的想起来了'}
 $('details').classList.add('show');$('rating').classList.add('show');updateStats();
}
function rate(kind){
 if(!revealed)return;const idx=queue[cursor],w=DATA[idx].word;
 if(kind==='again'){levels[w]=Math.max(0,levels[w]-1);queue.splice(Math.min(cursor+3,queue.length),0,idx)}
 else if(kind==='fuzzy'){levels[w]=Math.max(1,levels[w]);queue.splice(Math.min(cursor+6,queue.length),0,idx)}
 else levels[w]=Math.min(3,levels[w]+1);
 save();cursor++;render();
}
function finish(){
 $('study').classList.add('hidden');$('details').classList.remove('show');$('rating').classList.remove('show');$('finish').classList.add('show');
 const mastered=DATA.filter(x=>levels[x.word]>=3).length,weak=DATA.filter(x=>levels[x.word]<2).length;$('finishTitle').textContent=`已掌握 ${mastered} / ${DATA.length}`;
 $('finishText').textContent=`本轮首次命中率 ${firstAttempts?Math.round(firstCorrect/firstAttempts*100)+'%':'—'}。现在还有 ${weak} 个薄弱词。真正有效的是遮住答案后的回忆，不是多看几遍。`;updateStats();$('round').textContent='完成';
}
const TTS={scope:settings.accent,play(entry,acc){
 if(audio){audio.pause();audio=null}let actual=acc||TTS.scope,parts=entry.audioParts||[entry.word],part=0,triedFallback=false;
 const run=()=>{audio=new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(parts[part])}&type=${actual==='gb'?1:2}`);
  audio.onended=()=>{part++;if(part<parts.length)run();else if(settings.loop){part=0;run()}};
  audio.onerror=()=>{if(!triedFallback){triedFallback=true;actual=actual==='gb'?'us':'gb';part=0;run()}};
  audio.play().catch(()=>{});};run();
}};
$('reveal').onclick=()=>reveal();$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')reveal()});$('speak').onclick=()=>TTS.play(item());
document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{settings.mode=b.dataset.mode;save();render()});
['showEn','showZh','showEx'].forEach(id=>$(id).onclick=()=>{settings[id]=!settings[id];save();applyToggles()});
document.querySelectorAll('#accents button').forEach(b=>b.onclick=()=>{settings.accent=b.dataset.acc;TTS.scope=settings.accent;save();applyToggles()});
$('loop').onclick=()=>{settings.loop=!settings.loop;if(audio)audio.loop=settings.loop;save();applyToggles()};
$('shuffle').onclick=()=>{const rest=shuffle(queue.slice(cursor));queue=queue.slice(0,cursor).concat(rest);render()};
$('reset').onclick=()=>{if(confirm('清空 68 个词的记忆进度？')){DATA.forEach(x=>levels[x.word]=0);save();makeQueue(false)}};
$('nextRound').onclick=()=>makeQueue(false);$('reviewWeak').onclick=()=>makeQueue(true);
$('chips').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;queue=[Number(b.dataset.i)];cursor=0;render()};
document.addEventListener('keydown',e=>{if(!revealed)return;if(e.key==='1')rate('again');if(e.key==='2')rate('fuzzy');if(e.key==='3')rate('know')});
makeQueue(false);
</script></body></html>
